services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      # schema is applied automatically on first boot
      - ./db.sql:/docker-entrypoint-initdb.d/db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"

  server:
    build: .
    command: node server.js
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      ETL_LOG_DIR: /data
    volumes:
      - etl-data:/data
    ports:
      - "8000:8000"

  processor:
    build: .
    command: node data_processor.js
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      ETL_LOG_DIR: /data
      POLL_INTERVAL_MS: 1000
    volumes:
      - etl-data:/data

  # The producer is opt-in: `docker compose --profile demo up`, then write
  # events into the shared volume's events.jsonl (see README).
  client:
    build: .
    command: node client.js
    profiles: ["demo"]
    depends_on:
      server:
        condition: service_started
    environment:
      SERVER_URL: http://server:8000
      EVENTS_FILE: /data/events.jsonl
    volumes:
      - etl-data:/data

volumes:
  pgdata:
  etl-data:
